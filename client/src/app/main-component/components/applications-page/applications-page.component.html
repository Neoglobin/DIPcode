@if (isAddingApplication) {
  <section class="application-form" aria-labelledby="application-form-title">
    <h1 id="application-form-title">Добавить новое приложение GitLab</h1>
    <form (submit)="saveApplication($event, applicationId.value)">
      <label class="form-field">
        <span class="visually-hidden">Application ID</span>
        <input #applicationId name="applicationId" type="text" placeholder="Application ID" required />
        <span class="info-icon" aria-hidden="true">i</span>
      </label>
      <label class="form-field">
        <span class="visually-hidden">Secret</span>
        <input name="secret" type="password" placeholder="Secret" required />
        <span class="info-icon" aria-hidden="true">i</span>
      </label>
      <div class="form-actions">
        <button class="save-button" type="submit">Сохранить</button>
        <button class="cancel-button" type="button" (click)="cancelApplicationForm()">Отмена</button>
      </div>
    </form>
  </section>
} @else {
  <div class="panel-actions">
    <button class="action-button" type="button" (click)="openApplicationForm()">Добавить</button>
    <button class="action-button" type="button">Действия</button>
  </div>

  <div class="application-grid">
    @for (application of applications; track application.id) {
      <article class="application-card">
        <div class="application-icon">
          <svg viewBox="0 0 40 40" aria-hidden="true">
            <path d="m20 4 13 7.5v17L20 36 7 28.5v-17L20 4Z" />
            <path d="m7.5 11.5 12.5 7 12.5-7M20 19v16" />
            <path d="m13.5 8 13 7.5" />
          </svg>
        </div>
        <span class="application-name">{{ application.name }}</span>
      </article>
    }
  </div>
}
