<h1 class="page-title">Настройки</h1>
<div class="settings-grid">
  @for (tool of tools; track tool.id) 
  {
    @if (tool.visible) 
    {
      <button type="button" class="settings-card" (click)="usersSelected.emit()">
        <div class="settings-icon">
          <svg viewBox="0 0 40 40" aria-hidden="true">
            <path d="m20 4 13 7.5v17L20 36 7 28.5v-17L20 4Z" />
            <path d="m7.5 11.5 12.5 7 12.5-7M20 19v16" />
            <path d="m13.5 8 13 7.5" />
          </svg>
        </div>
        <span class="settings-name">{{ tool.name }}</span>
      </button>
    }
  }
</div>
