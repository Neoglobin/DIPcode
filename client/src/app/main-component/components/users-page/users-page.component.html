@if (isAddingUser) {
  <section class="user-form" aria-labelledby="user-form-title">
    <h1 id="user-form-title">Добавить пользователя</h1>
    <form (submit)="saveUser($event, userName.value, userEmail.value, userRole.value)">
      <label class="form-field">
        <span class="visually-hidden">Имя</span>
        <input #userName name="name" type="text" placeholder="Имя" required />
      </label>
      <label class="form-field">
        <span class="visually-hidden">Email</span>
        <input #userEmail name="email" type="email" placeholder="Email" required />
      </label>
      <label class="form-field">
        <span class="visually-hidden">Пароль</span>
        <input name="password" type="password" placeholder="Пароль" required />
      </label>
      <label class="form-field role-field">
        <span>Роли пользователя</span>
        <select #userRole name="role" required>
          @for (role of roles; track role) {
            <option [value]="role">{{ role }}</option>
          }
        </select>
      </label>
      <div class="form-actions">
        <button class="save-button" type="submit">Сохранить</button>
        <button class="cancel-button" type="button" (click)="cancelUserForm()">Отмена</button>
      </div>
    </form>
  </section>
} @else {
  <div class="panel-actions">
    <button class="action-button" type="button" (click)="openUserForm()">Добавить</button>
    <button class="action-button" type="button">Действия</button>
  </div>

  <div class="user-grid">
    @for (user of users; track user.id) {
      <article class="user-card">
        <div class="user-icon">
          <svg viewBox="0 0 40 40" aria-hidden="true">
            <circle cx="20" cy="13" r="7" />
            <path d="M7 36v-3a13 13 0 0 1 26 0v3" />
          </svg>
        </div>
        <span class="user-name">{{ user.name }}</span>
      </article>
    }
  </div>
}
