<div class="panel-actions">
  <button class="action-button" type="button">Добавить</button>
  <button class="action-button" type="button">Действия</button>
</div>

<div class="user-grid">
  @for (user of users; track user.id) {
    <article class="user-card">
      <div class="user-icon">
        <svg viewBox="0 0 40 40" aria-hidden="true">
          <circle cx="20" cy="13" r="7" />
          <path d="M7 36v-3a13 13 0 0 1 26 0v3" />
        </svg>
      </div>
      <span class="user-name">{{ user.name }}</span>
    </article>
  }
</div>
