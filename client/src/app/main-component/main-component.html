<main class="frame">
  <div class="toolbar">
    <div class="left-column">
      <app-navigation
        [sidebarCollapsed]="sidebarCollapsed"
        [canGoBack]="canGoBack"
        [canGoForward]="canGoForward"
        (menuToggle)="toggleSidebar()"
        (previous)="goBack()"
        (next)="goForward()"
      />
    </div>
    <app-search />
    <div class="right-controls">
      <app-chat-selector />
      <app-quick-access (settingsSelected)="selectPage('settings')" />
    </div>
  </div>
  <div class="workspace" [class.sidebar-collapsed]="sidebarCollapsed" [class.chat-collapsed]="chatCollapsed" [class.chat-resizing]="chatResizing" [style.--chat-track-size]="chatTrackSize === null ? null : chatTrackSize + 'px'">
    <app-sidebar
      [collapsed]="sidebarCollapsed"
      [selectedPage]="selectedPage"
      (pageSelected)="selectPage($event)"
    />
    <app-central-panel>
      @switch (selectedPage) {
        @case ('applications') {
          <app-applications-page />
        }
        @case ('projects') {
          <app-projects-page />
        }
        @case ('settings') {
          <app-settings-page (usersSelected)="selectPage('users')" />
        }
        @case ('users') {
          <app-users-page />
        }
      }
    </app-central-panel>
    <app-chat-panel (collapsedChange)="chatCollapsed = $event" (widthChange)="chatTrackSize = $event" (resizingChange)="chatResizing = $event" />
  </div>
</main>
